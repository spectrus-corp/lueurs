<!doctype html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>Lueurs : jeu 3D</title>
<style>
:root{--g:#ffd36b;--r:#ff6b8a;--c:#6be3ff;--bg:#14102a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#f3e9d2;font-family:Georgia,'Times New Roman',serif;touch-action:none;user-select:none}
canvas{display:block}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 1px 8px #000a;font-size:20px}
#s{font-size:34px;color:var(--g)}#cb{color:var(--c);margin-left:8px}
#wl{font-size:14px;opacity:.85;color:var(--c)}
#fx{font-size:15px;color:var(--c);text-align:center;line-height:1.5}
#l{color:var(--r);font-size:24px}
#bn{position:fixed;top:22%;left:0;right:0;text-align:center;font-size:clamp(28px,6vw,52px);color:var(--g);pointer-events:none;text-shadow:0 2px 16px #000;opacity:0}
#dash{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:120px;height:8px;border-radius:4px;background:#ffffff22}
#db{display:block;height:100%;background:var(--g);border-radius:4px;transform-origin:left}
#dbtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;padding:18px 24px}
@media(pointer:coarse){#dbtn{display:block}}
#fl{position:fixed;inset:0;background:#ff2a55;opacity:0;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0820ee;text-align:center;padding:24px;gap:14px;z-index:5}
#msg h1{font-size:clamp(36px,8vw,64px);color:var(--g);margin:0;text-shadow:0 0 24px #ffd36b66}
#msg p{max-width:420px;line-height:1.5;opacity:.9;margin:0}
#msg .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 28px;background:linear-gradient(180deg,#ffe29a,#e0a83a);color:#2a1a00;font-weight:700;box-shadow:0 4px 0 #9a6a18,0 8px 24px #0008}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #9a6a18}
button:disabled{opacity:.45;cursor:not-allowed}
#bs{background:linear-gradient(180deg,#c8f0ff,#4ab8e0);box-shadow:0 4px 0 #2a7a9a,0 8px 24px #0008;color:#062436}
#go{display:flex;flex-direction:column;gap:10px;align-items:center}
#nm{font:inherit;padding:12px 16px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:#fff;width:min(260px,80vw);text-align:center}
#board{width:min(360px,90vw);background:#ffffff0d;border:1px solid #ffffff22;border-radius:16px;padding:12px 16px;text-align:left}
#board h2{margin:0 0 8px;font-size:16px;color:var(--c);letter-spacing:.04em}
#bl{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.7}
#bl .e{opacity:.55;list-style:none;margin-left:-18px}
#shop{background:#14102af5;justify-content:flex-start}
#shop h1{margin-top:calc(24px + env(safe-area-inset-top,0px))}
#sinfo{display:flex;gap:16px;font-size:15px;opacity:.9}
#sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;width:min(640px,94vw);max-height:50vh;overflow:auto;padding:4px}
.cd{background:#ffffff10;border:1px solid var(--rc,#fff3);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.cd .sw{width:56px;height:56px;border-radius:50%;display:block;box-shadow:0 0 16px var(--rc)}
.cd b{font-size:14px}.cd .rr{font-size:11px;opacity:.75}.cd button{padding:8px 14px;font-size:13px}
.cd em{font-style:normal;font-size:12px;color:#7dffb0}
#sc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(640px,94vw)}
#sc button{padding:8px 12px;font-size:12px;background:#ffffff18;color:#f3e9d2;box-shadow:none}
#sc button.on{outline:2px solid var(--g)}
#sx{margin-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:18px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:#14102acc;color:#ffd36b;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);pointer-events:auto;box-shadow:0 2px 12px #0008}
#mute.on{display:flex}
#mute:active{transform:scale(.94)}
</style>
</head>
<body>
<div id='hud'><div><span id='s'>0</span><span id='cb'></span><div id='wl'></div></div><div id='fx'></div><div id='l'></div></div>
<div id='bn'></div>
<div id='dash'><i id='db'></i></div>
<button id='dbtn'>Dash</button>
<button id='mute' type='button' aria-label='Muet'>🔊</button>
<div id='fl'></div>
<div id='msg'>
<h1 id='t'>Lueurs</h1>
<p id='p'>Attrapez les lueurs dorées en enchaînant les prises pour faire monter le combo, et survivez aux cristaux.</p>
<div id='go' hidden><input id='nm' maxlength='12' placeholder='Votre pseudo' autocomplete='off'><button id='sb'>Envoyer mon score</button></div>
<div id='board'><h2>Records mondiaux</h2><ol id='bl'><li class='e'>Chargement…</li></ol></div>
<div class='row'><button id='b'>Jouer</button><button id='bs'>Boutique</button></div>
</div>
<div id='shop' hidden>
<h1>Boutique</h1>
<div id='sinfo'><span id='sw'></span><span id='st'></span></div>
<div id='sg'></div>
<div id='sc'></div>
<button id='sx'>Retour</button>
</div>
<script src='https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js'></script>
<script>

</script>
</body>
</html>
